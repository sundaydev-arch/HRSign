services:
  postgres:
    image: postgres:16-alpine
    container_name: hrsign-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hrsign
      POSTGRES_PASSWORD: hrsign_dev_123
      POSTGRES_DB: hrsign
    ports:
      - "5433:5432"
    volumes:
      - hrsign_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrsign -d hrsign"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    container_name: hrsign-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - hrsign_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: hrsign-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin123 &&
      mc mb -p local/hrsign || true &&
      mc anonymous set none local/hrsign &&
      echo 'MinIO bucket hrsign ready'
      "

volumes:
  hrsign_pgdata:
  hrsign_miniodata:
