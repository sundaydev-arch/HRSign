name: Release images

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          echo "web=ghcr.io/${OWNER}/hrsign-web" >> "$GITHUB_OUTPUT"
          echo "worker=ghcr.io/${OWNER}/hrsign-worker" >> "$GITHUB_OUTPUT"
          TAG=${GITHUB_REF_NAME}
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build & push web
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ steps.meta.outputs.web }}:latest
            ${{ steps.meta.outputs.web }}:${{ steps.meta.outputs.tag }}

      - name: Build & push worker
        uses: docker/build-push-action@v6
        with:
          context: .
          target: worker
          push: true
          tags: |
            ${{ steps.meta.outputs.worker }}:latest
            ${{ steps.meta.outputs.worker }}:${{ steps.meta.outputs.tag }}
