name: Bug report
description: Report a reproducible problem with HRSign
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Please fill in every section — issues without
        reproduction steps may be closed. **Do not report security vulnerabilities
        here**; see [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the problem.
      placeholder: |
        1. Go to '...'
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, screenshots, browser console output, and relevant server logs (redact secrets).
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Templates / PDF editor
        - Signing tasks / approval
        - External signing
        - Seals
        - Authentication / RBAC
        - Storage / file access
        - Notifications / email
        - Internationalization
        - Deployment / Docker
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: HRSign version / commit
      placeholder: "0.2.0 / commit sha"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, Node.js version, browser (for UI issues), database/MinIO setup.
      placeholder: "Ubuntu 24.04, Node 20.18, Chrome 139, docker compose"
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and did not find a duplicate
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md)
          required: true
