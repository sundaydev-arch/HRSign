# Include from http {} context, or merge limit_req_zone into the main nginx.conf.
# limit_req_zone $binary_remote_addr zone=hrsign_api:10m rate=30r/s;

upstream hrsign_web {
  server web:3000;
}

upstream hrsign_api {
  # Prefer Next /api/v1; point at api-py:8000 or api-go:8080 for sibling backends.
  server web:3000;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 25m;

  location /api/health {
    proxy_pass http://hrsign_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/metrics {
    # Restrict in production (IP allowlist / basic auth).
    proxy_pass http://hrsign_web;
    proxy_set_header Host $host;
  }

  location /v1/ {
    proxy_pass http://hrsign_api/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Account-Id $http_x_account_id;
  }

  location / {
    proxy_pass http://hrsign_web;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
}
